[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workout-mcp"
version = "0.1.0"
description = "MCP server khusus workout Garmin (buat/edit/jadwal/kirim ke device)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.2",
    "mcp>=1.28.1,<2",
]

[project.scripts]
workout-mcp = "workout_mcp:main"
workout-mcp-auth = "workout_mcp.auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workout_mcp"]
