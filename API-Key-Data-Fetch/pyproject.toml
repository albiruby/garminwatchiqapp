[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-packet"
version = "0.1.0"
description = "Report factory: Garmin Personal API + Garmin Connect + Intervals.icu -> self-contained Markdown analysis packets"
readme = "PACKET-README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "garminconnect==0.3.2",
    "mcp>=1.28.1,<2",
]

[project.scripts]
garmin-packet = "garmin_packet.cli:main"
garmin-packet-mcp = "garmin_packet.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["garmin_packet"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
