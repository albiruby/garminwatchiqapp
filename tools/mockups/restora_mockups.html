<!doctype html>
<html><head><meta charset="utf-8"><title>RESTORA UI mockups</title>
<!--
  RESTORA watch UI at 390 x 390 (Forerunner 165), mirroring the Monkey C views:
  same 390-px grid, palette (Theme.mc), Roboto Mono sizes and line metrics
  (resources/fonts/*.fnt), ring geometry (Hud.mc), icons (Icons.mc), menu rows
  (MenuKit.mc). Native CustomMenu scrolling is approximated; data is illustrative.

  Layout check: every text/icon ink box is recorded and tested against the
  screen's safe circle and against every other box. Problems are listed in
  window.LAYOUT_ISSUES (printed by render.js) and outlined in red on the canvas
  when ?debug=1.
  Render: node tools/mockups/render.js
-->
<style>
@font-face{font-family:RM;font-weight:400;src:url(../fonts/RobotoMono-Regular.ttf)}
@font-face{font-family:RM;font-weight:500;src:url(../fonts/RobotoMono-Medium.ttf)}
@font-face{font-family:RM;font-weight:700;src:url(../fonts/RobotoMono-Bold.ttf)}
body{margin:0;background:#0b0d0c;font-family:RM,monospace}
.grid{display:flex;flex-wrap:wrap;gap:30px;padding:30px;width:1310px}
.cell{color:#9aa69e;text-align:center;font:500 16px RM;letter-spacing:.5px}
canvas{display:block;border-radius:50%;box-shadow:0 0 0 12px #1e2321,0 0 0 14px #3a413d;margin:14px auto 16px}
</style></head><body><div class="grid" id="g"></div>
<script>
const DEBUG=location.search.includes('debug');
// ---- Theme.mc ----
const BG='#000000',DEEP='#142A22',SURFACE='#243F33',SAGE='#8FAF96',MINT='#C7DCC9',IVORY='#F1EEE4',
      GREY='#77847B',LINE='#2C3631',AMBER='#D9A441';
const SAFE_HUD=160,SAFE_PAGE=170,SAFE_MENU=160;
// [weight, px, lineHeight, base] from resources/fonts/*.fnt
const FONT={label:[500,17,23,18],body:[400,21,28,22],title:[700,27,37,29],num:[700,44,59,47],hero:[700,80,106,84]};
const W=390,H=390,CX=195,CY=195;
const L=0,C=1,R=2;
let BOXES=[];window.LAYOUT_ISSUES=[];
function setFont(x,f){x.font=`${FONT[f][0]} ${FONT[f][1]}px RM`;}
function tw(x,s,f){setFont(x,f);return Math.round(x.measureText(s).width);}
const safeHalf=(yy,r)=>{const d=yy-CY,sq=r*r-d*d;return sq>0?Math.trunc(Math.sqrt(sq)):0;};
const lineWidth=(top,h,r)=>2*Math.min(safeHalf(top,r),safeHalf(top+h,r));
// Connect IQ drawText: y = top of the line box.
function text(x,X,yy,f,col,s,just){if(!s)return;setFont(x,f);x.fillStyle=col;x.textBaseline='alphabetic';
  x.textAlign=just==C?'center':just==R?'right':'left';const base=yy+FONT[f][3];x.fillText(s,X,base);
  const m=x.measureText(s);BOXES.push({k:'text:'+s,x0:X-m.actualBoundingBoxLeft,x1:X+m.actualBoundingBoxRight,
    y0:base-m.actualBoundingBoxAscent,y1:base+m.actualBoundingBoxDescent});}
const ctext=(x,yy,f,col,s)=>text(x,CX,yy,f,col,s,C);
function divider(x,yy,r,inset){const h=safeHalf(yy,r)-inset;if(h<=0)return;x.strokeStyle=LINE;x.lineWidth=1;
  x.beginPath();x.moveTo(CX-h,yy+.5);x.lineTo(CX+h,yy+.5);x.stroke();}
function fit(x,s,f,maxW){if(tw(x,s,f)<=maxW)return s;let n=s.length;while(n>1&&tw(x,s.slice(0,n)+'.',f)>maxW)n--;return s.slice(0,n)+'.';}
function fitLine(x,yy,s,f,small,r,col){const w=lineWidth(yy,30,r)-8;let ff=f;if(small&&tw(x,s,f)>w)ff=small;ctext(x,yy,ff,col,fit(x,s,ff,w));}
function fitArea(x,s,f,w,h){const lines=[];let cur='';for(const word of s.split(' ')){const t=cur?cur+' '+word:word;
  if(tw(x,t,f)>w){lines.push(cur);cur=word;}else cur=t;}lines.push(cur);const max=Math.max(1,Math.floor(h/FONT[f][2]));
  if(lines.length>max){lines.length=max;lines[max-1]=fit(x,lines[max-1]+'...',f,w);}return lines;}
function arc(x,cx,cy,r,cw,s,e,pen,col){x.strokeStyle=col;x.lineWidth=pen;x.lineCap='butt';x.beginPath();
  x.arc(cx,cy,r,-s*Math.PI/180,-e*Math.PI/180,!cw);x.stroke();}
function startHint(x){arc(x,CX,CY,W/2-4,false,22,38,6,MINT);}
const mmss=s=>String(Math.trunc(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
// ---- Hud.mc ----
const BEZEL_R=190,PHASE_R=177;
function segmentRing(x,weights,active,permille,radius,pen,activeColor){const total=weights.reduce((a,b)=>a+b,0);let start=90;
  weights.forEach((w,i)=>{if(w<=0)return;const sweep=360*w/total,s=start-1.5,e=start-sweep+1.5;
    if(s-e>=1){arc(x,CX,CY,radius,true,Math.trunc(s),Math.trunc(e),pen,i<active?MINT:SURFACE);
      if(i==active&&permille>0){const fe=s-(s-e)*permille/1000;if(s-fe>=1)arc(x,CX,CY,radius,true,Math.trunc(s),Math.trunc(fe),pen,activeColor);}}
    start-=sweep;});}
function field(x,X,yy,vy,label,value,vf){text(x,X,yy,'label',GREY,label,C);text(x,X,vy,vf,IVORY,value,C);}
function fieldPair(x,yy,vy,off,l1,v1,l2,v2,vf){field(x,CX-off,yy,vy,l1,v1,vf);field(x,CX+off,yy,vy,l2,v2,vf);
  vline(x,yy+4,vy+24);}
function vline(x,a,b){x.strokeStyle=LINE;x.lineWidth=1;x.beginPath();x.moveTo(CX+.5,a);x.lineTo(CX+.5,b);x.stroke();}
function hapticMark(x,yy){x.strokeStyle=SAGE;x.lineWidth=1;[[-4,3,4],[0,5,6],[4,3,4]].forEach(([dx,a,b])=>{x.beginPath();
  x.moveTo(CX+dx+.5,yy-a);x.lineTo(CX+dx+.5,yy+b);x.stroke();});BOXES.push({k:'haptic',x0:CX-5,x1:CX+5,y0:yy-5,y1:yy+6});}
// ---- Icons.mc ----
function icon(x,cat,cx,cy,s,col){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2;const h=Math.trunc(s/2);
  const line=(a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();};
  const dot=(a,b,r)=>{x.beginPath();x.arc(a,b,r,0,7);x.fill();};
  if(cat==0){for(let i=0;i<3;i++){const ly=cy-h/2+i*h/2,len=i==1?h:h*2/3;line(cx-h,ly,cx-h+len+h/3,ly);
      arc(x,cx-h+len+h/3,ly-h/6,h/6,false,270,180,2,col);}}
  else if(cat==1){x.beginPath();x.arc(cx,cy,h,0,7);x.stroke();x.beginPath();x.arc(cx,cy,h*3/5,0,7);x.stroke();dot(cx,cy,h/4);}
  else if(cat==2){for(let k=0;k<2;k++){const oy=cy-h/3+k*h*2/3;let px=cx-h,py=oy;
      for(let j=1;j<=12;j++){const nx=cx-h+j*s/12,ny=oy+Math.trunc(Math.sin(j*Math.PI/6+k)*h/4);line(px,py,nx,ny);px=nx;py=ny;}}}
  else if(cat==3){for(let m=0;m<3;m++){const bx=cx-h+m*h*2/3,l2=h/2+m*h/3;line(bx,cy+h/2,bx+l2/2,cy+h/2-l2);}dot(cx+h*2/3,cy-h*2/3,s/10+1);}
  else if(cat==4){dot(cx,cy,h*4/5);x.fillStyle=BG;dot(cx+h*2/5,cy-h/4,h*2/3);}
  else if(cat==5){const a=Math.trunc(h*3/4),c=Math.trunc(h*2/5),r=Math.trunc(Math.sqrt(2*a*a+2*c*c)),t=Math.trunc(Math.atan2(a+c,a-c)*180/Math.PI);
      arc(x,cx+c,cy+c,r,false,t,270-t,2,col);arc(x,cx-c,cy-c,r,false,t+180,(450-t)%360,2,col);line(cx-a,cy+a,cx+a,cy-a);}
  else if(cat==10){x.beginPath();x.moveTo(cx-h/2,cy-h*2/3);x.lineTo(cx+h*2/3,cy);x.lineTo(cx-h/2,cy+h*2/3);x.fill();}
  else if(cat==11){const bw=Math.trunc(s/6),hs=[h/2,h,h*3/4,h*3/2];for(let i=0;i<4;i++)x.fillRect(cx-h+i*(bw+2),cy+h*3/4-hs[i],bw,hs[i]);}
  else if(cat==12){x.beginPath();x.arc(cx,cy,h*2/3,0,7);x.stroke();dot(cx,cy,h/4);
      line(cx-h,cy,cx-h*2/3,cy);line(cx+h*2/3,cy,cx+h,cy);line(cx,cy-h,cx,cy-h*2/3);line(cx,cy+h*2/3,cx,cy+h);}
  x.lineWidth=1;BOXES.push({k:'icon'+cat,x0:cx-h-1,x1:cx+h+1,y0:cy-h-1,y1:cy+h+1});}
// ---- MenuKit.mc (CustomMenu: title 116, rows 96, focused 104, mask r160) ----
const ITEM_H=96,FOCUS_H=104,TITLE_H=116;
function menuTitle(x,top,title){text(x,CX,top+42,'label',GREY,'20:27',C);text(x,CX,top+63,'title',IVORY,title,C);
  x.strokeStyle=LINE;x.beginPath();x.moveTo(CX-80,top+108.5);x.lineTo(CX+80,top+108.5);x.stroke();}
function row(x,top,focused,it){const h=focused?FOCUS_H:ITEM_H,midY=top+h/2,iconX=94,valueX=304;let textX=iconX;
  if(focused){x.fillStyle=DEEP;x.beginPath();x.roundRect(55,top+8,W-110,h-16,14);x.fill();
    BOXES.push({k:'surface',x0:55,x1:W-55,y0:top+8,y1:top+h-8,bg:1});
    x.fillStyle=MINT;x.beginPath();x.roundRect(55,midY-16,4,32,2);x.fill();}
  if(it.icon!=null){icon(x,it.icon,iconX,midY,focused?28:20,focused?MINT:GREY);textX=iconX+32;}
  const nf=focused?'title':'body',hasSub=focused&&it.sub;const nameY=hasSub?midY-27:midY-FONT[nf][2]/2;
  let right=it.value!=null?valueX-tw(x,it.value,'body')-10:valueX;
  const vSub=hasSub&&it.value!=null&&tw(x,it.name,nf)>right-textX;if(vSub)right=valueX;
  text(x,textX,nameY,nf,focused?IVORY:GREY,fit(x,it.name,nf,right-textX),L);
  if(hasSub)text(x,textX,midY+4,'label',SAGE,fit(x,it.sub,'label',valueX-textX-(vSub?tw(x,it.value,'label')+10:0)),L);
  if(it.value!=null){if(vSub)text(x,valueX,midY+4,'label',it.on?MINT:GREY,it.value,R);
    else text(x,valueX,nameY+(hasSub?4:0),'body',it.on?MINT:GREY,it.value,R);}}
function menu(x,title,items,focus){let top;
  if(focus==0){menuTitle(x,0,title);top=TITLE_H;}else{top=CY-FOCUS_H/2-ITEM_H*focus;menuTitle(x,top-TITLE_H,title);}
  items.forEach((it,i)=>{const f=i==focus;row(x,top,f,it);top+=f?FOCUS_H:ITEM_H;});
  // MenuMask: black outside r160; drop boxes it hides entirely.
  x.strokeStyle=BG;x.lineWidth=40;x.beginPath();x.arc(CX,CY,SAFE_MENU+20,0,7);x.stroke();x.lineWidth=1;
  BOXES=BOXES.filter(b=>!hidden(b,SAFE_MENU));}
function corners(b){return [[b.x0,b.y0],[b.x1,b.y0],[b.x0,b.y1],[b.x1,b.y1]];}
function hidden(b,r){return corners(b).every(([a,c])=>Math.hypot(a-CX,c-CY)>r);}

// ---- screens ----
const g=document.getElementById('g');
function screen(title,safe,draw){BOXES=[];const d=document.createElement('div');d.className='cell';const c=document.createElement('canvas');
  c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';const x=c.getContext('2d');x.scale(2,2);
  x.fillStyle=BG;x.fillRect(0,0,W,H);draw(x);
  const bad=[];BOXES.forEach(b=>{const out=Math.max(...corners(b).map(([a,c])=>Math.hypot(a-CX,c-CY)))-safe;
    if(out>0.5)bad.push(`outside r${safe} by ${out.toFixed(1)}px: ${b.k}`);});
  for(let i=0;i<BOXES.length;i++)for(let j=i+1;j<BOXES.length;j++){const a=BOXES[i],b=BOXES[j];if(a.bg||b.bg)continue;
    if(a.x0<b.x1-0.5&&b.x0<a.x1-0.5&&a.y0<b.y1-0.5&&b.y0<a.y1-0.5)bad.push(`overlap: ${a.k} / ${b.k}`);}
  bad.forEach(m=>window.LAYOUT_ISSUES.push(title+': '+m));
  if(DEBUG){x.strokeStyle='rgba(255,60,60,.6)';x.setLineDash([3,3]);x.beginPath();x.arc(CX,CY,safe,0,7);x.stroke();
    BOXES.forEach(b=>x.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0));}
  d.appendChild(c);d.appendChild(document.createTextNode(title));g.appendChild(d);}
const MOD=['BREATHE','MIND','CIRCULATE','MOBILITY','SLEEP','RECOVER'];
const SUB=['BREATHING','MEDITATION','LEG & CIRCULATION','STRETCH & MOVE','WIND DOWN','POST-ACTIVITY'];
const home=[{name:'CONTINUE',sub:'LEG RELIEF  10:00',icon:10},...MOD.map((m,i)=>({name:m,sub:SUB[i],icon:i})),
  {name:'HISTORY',sub:'THIS WEEK',icon:11},{name:'SETTINGS',sub:'HAPTICS, COUNTDOWN',icon:12}];
const LEG=[['DIAPHRAGM BREATHING',120],['ANKLE PUMPS',60],['ANKLE CIRCLES',60],['LEGS UP THE WALL',300],['SLOW TRANSITION',60]];
const LEGW=LEG.map(s=>s[1]);

// SessionPlayerView.onUpdate
function hud(x,o){const S=SAFE_HUD;segmentRing(x,o.weights,o.step,o.stepPermille,BEZEL_R,6,o.paused?AMBER:SAGE);
  const top=o.counting?'GET READY':`STEP ${String(o.step+1).padStart(2,'0')}/${String(o.weights.length).padStart(2,'0')}`;
  fitLine(x,56,top,'label',null,S,SAGE);fitLine(x,79,o.name,'body','label',S,IVORY);divider(x,114,S,0);
  const heroC=o.paused?GREY:IVORY;const sr=(s,c)=>fitLine(x,228,s.toUpperCase(),'label',null,S,c);
  const bottom=(l1,v1,l2,v2)=>{divider(x,260,S,0);fieldPair(x,266,285,52,l1,v1,l2,v2,'body');hapticMark(x,324);};
  if(o.counting){ctext(x,114,'hero',heroC,String(o.count));sr('START TO PAUSE',GREY);bottom('STEPS',String(o.weights.length),'TOTAL',mmss(o.total));return;}
  if(o.pattern){const ph=o.phase,pm=o.phaseRemainMs,phMs=o.pattern[ph]*1000;
    segmentRing(x,o.pattern,ph,Math.trunc((phMs-pm)*1000/phMs),PHASE_R,8,o.paused?AMBER:MINT);
    ctext(x,117,'title',o.paused?GREY:MINT,['INHALE','HOLD','EXHALE','HOLD'][ph]);
    ctext(x,134,'hero',heroC,String(Math.trunc((pm+999)/1000)).padStart(2,'0'));
    sr(o.paused?'PAUSED':'PATTERN '+o.pattern.join('-'),o.paused?AMBER:GREY);
    bottom('CYCLES',String(o.cycles).padStart(2,'0'),'LEFT',mmss(o.left));}
  else{ctext(x,114,'hero',heroC,mmss(o.remain));ctext(x,208,'label',o.side?MINT:SAGE,o.side||o.type);
    if(o.paused)sr('PAUSED',AMBER);else if(o.remain<=10&&o.next)sr('NEXT: '+o.next,MINT);else sr(o.cue,GREY);
    bottom('LEFT',mmss(o.left),'DONE',o.done+'%');}}

async function boot(){
await Promise.all(['500 17px RM','400 21px RM','700 27px RM'].map(f=>document.fonts.load(f)));
screen('01  HOME',SAFE_MENU,x=>menu(x,'RESTORA',home,0));
screen('02  HOME - SCROLLED',SAFE_MENU,x=>menu(x,'RESTORA',home,3));
screen('03  MODULE: CIRCULATE',SAFE_MENU,x=>menu(x,'CIRCULATE',[{name:'LEG RESET',sub:'3 STEPS',value:'05:00'},
  {name:'LEG RELIEF',sub:'5 STEPS',value:'10:00'},{name:'DESK BREAK',sub:'5 STEPS',value:'05:00'}],1));
screen('04  SESSION DETAIL',SAFE_PAGE,x=>{const S=SAFE_PAGE;icon(x,2,CX,50,20,SAGE);ctext(x,64,'label',SAGE,'CIRCULATE');
  fitLine(x,83,'LEG RELIEF','title','body',S,IVORY);ctext(x,114,'label',GREY,'10:00  5 STEPS');divider(x,145,S,16);
  let yy=150;LEG.forEach((s,i)=>{const half=lineWidth(yy+5,14,S)/2-6,idx=String(i+1).padStart(2,'0'),t=mmss(s[1]),x0=CX-half,x1=CX+half;
    const nx=x0+tw(x,idx+' ','label'),nm=x1-nx-tw(x,'  '+t,'label');text(x,x0,yy,'label',SAGE,idx,L);
    text(x,nx,yy,'label',IVORY,fit(x,s[0],'label',nm),L);text(x,x1,yy,'label',GREY,t,R);yy+=22;});
  divider(x,264,S,16);const nw=lineWidth(276,37,S)-8;
  fitArea(x,'Leg elevation is not for everyone (e.g. glaucoma, heart or kidney failure, uncontrolled blood pressure). Ask a clinician if unsure. Not a treatment.','label',nw,46)
    .forEach((l,i)=>ctext(x,271+i*23,'label',GREY,l));ctext(x,324,'label',MINT,'START');startHint(x);});
screen('05  HUD - COUNTDOWN',SAFE_HUD,x=>hud(x,{counting:true,count:3,weights:LEGW,step:0,stepPermille:0,mod:'CIRCULATE',name:LEG[0][0],total:600}));
screen('06  HUD - BREATHE (BOX, INHALE)',SAFE_HUD,x=>hud(x,{weights:[300],step:0,stepPermille:220,mod:'BREATHE',name:'BOX BREATHING',pattern:[4,4,4,4],phase:0,phaseRemainMs:1600,cycles:4,left:234}));
screen('07  HUD - BREATHE (EXHALE, PAUSED)',SAFE_HUD,x=>hud(x,{weights:LEGW,step:0,stepPermille:450,mod:'CIRCULATE',name:LEG[0][0],pattern:[4,0,6,0],phase:2,phaseRemainMs:3200,cycles:5,left:546,paused:true}));
screen('08  HUD - HOLD',SAFE_HUD,x=>hud(x,{weights:LEGW,step:3,stepPermille:320,mod:'CIRCULATE',name:LEG[3][0],remain:204,type:'HOLD POSITION',cue:'Hips near wall, legs up',next:'Slow Transition',left:264,done:56}));
screen('09  HUD - ALTERNATE (LAST 10 S)',SAFE_HUD,x=>hud(x,{weights:LEGW,step:2,stepPermille:870,mod:'CIRCULATE',name:LEG[2][0],remain:8,side:'RIGHT SIDE',cue:'Circle the ankle slowly',next:'Legs Up the Wall',left:368,done:39}));
screen('10  SUMMARY',SAFE_PAGE,x=>{const S=SAFE_PAGE;ctext(x,50,'label',MINT,'SESSION COMPLETE');fitLine(x,71,'LEG RELIEF','title','body',S,IVORY);
  ctext(x,99,'num',IVORY,'09:50');ctext(x,148,'label',GREY,'ACTIVE TIME');divider(x,180,S,16);
  [['EXERCISES','5/5'],['COMPLETE','100%'],['HR 85>74','-11'],['CYCLES','12']].forEach((f,i)=>{const r2=i>=2;
    field(x,i%2?CX+62:CX-62,r2?244:184,r2?259:199,f[0],f[1],'title');});
  vline(x,188,230);divider(x,240,S,30);vline(x,248,290);divider(x,300,S,16);
  ctext(x,304,'label',GREY,'HR: GARMIN');ctext(x,322,'label',GREY,'CALC: RESTORA');startHint(x);});
function stat(x,X,yy,v,l){text(x,X,yy,'num',MINT,v,C);text(x,X,yy+49,'label',GREY,l,C);}
screen('11  HISTORY - THIS WEEK',SAFE_PAGE,x=>{const S=SAFE_PAGE;ctext(x,49,'title',IVORY,'THIS WEEK');divider(x,94,S,16);
  stat(x,CX-64,95,'12','SESSIONS');stat(x,CX+64,95,'95','MINUTES');stat(x,CX-64,177,'5','MODULES');stat(x,CX+64,177,'4','STREAK');
  vline(x,104,246);divider(x,170,S,40);
  const by=262,half=safeHalf(by+6,S)-40;let bx=CX-half;const bw=half*2;x.fillStyle=SURFACE;x.beginPath();x.roundRect(bx,by,bw,6,3);x.fill();
  BOXES.push({k:'sharebar',x0:bx,x1:bx+bw,y0:by,y1:by+6});
  const cols=[MINT,SAGE,'#A9C4AE','#6E8F77','#DCE8DD','#557461'];[22,12,38,14,9,5].forEach((p,i)=>{const sw=Math.trunc(bw*p/100);x.fillStyle=cols[i];x.fillRect(bx,by,sw>2?sw-2:sw,6);bx+=sw;});
  ctext(x,276,'label',GREY,'COMPLETED 92%');ctext(x,306,'label',GREY,'CALC: RESTORA');});
screen('12  HISTORY - PAGE 2',SAFE_PAGE,x=>{const S=SAFE_PAGE;ctext(x,49,'title',IVORY,'THIS WEEK');divider(x,94,S,16);let yy=100;
  const rows=[['CIRCULATION','35 MIN',1],['LEG ELEV.','22 MIN',1],['WIND-DOWN','15 MIN',1],['AVG SESSION','07:55',1],['PRE HR 14D','--',0]];
  rows.forEach((r,i)=>{const half=lineWidth(yy+7,15,S)/2-6;text(x,CX-half,yy+4,'label',GREY,r[0],L);text(x,CX+half,yy,'body',r[2]?IVORY:GREY,r[1],R);
    if(i<rows.length-1)divider(x,yy+30,S,24);yy+=34;});
  fitLine(x,278,'TOP: LEG RELIEF','label',null,S,SAGE);ctext(x,306,'label',GREY,'CALC: RESTORA');});
screen('13  SETTINGS',SAFE_MENU,x=>menu(x,'SETTINGS',[{name:'HAPTICS',sub:'VIBRATION CUES',value:'ON',on:1},{name:'COUNTDOWN',sub:'BEFORE START',value:'3S',on:1},
